<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Calendário — Agosto 2026</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0d0f14;--surface:#171a22;--surface2:#1e2130;
  --border:#252833;--border2:#1c1f2a;
  --t1:#e8eaf0;--t2:#7c8296;--t3:#454b60;--t4:#2a2e40;
  --today-bg:#1e2540;--sel-bg:#1a2242;
  --blue:#4a7fd4;--amber:#d4963a;--green:#3aad72;
  --purple:#9b72cf;--teal:#3ab8b0;--rose:#cf7272;
  --panel:#131620;--pborder:#252a3a;
  --input:#1a1d2a;--btn:#252a3a;--btn2:#2e3347;
  --cborder:#3d4255;--done:#454b60;
  --overlay:rgba(0,0,0,.72);
  --modal:#171a22;--mborder:#252833;
}
@media(prefers-color-scheme:light){:root{
  --bg:#f0f2f7;--surface:#fff;--surface2:#f8f9fc;
  --border:#dde0ea;--border2:#e8ebf2;
  --t1:#1a1d27;--t2:#6b7080;--t3:#b0b5c5;--t4:#d0d4e0;
  --today-bg:#e8edff;--sel-bg:#dce7ff;
  --panel:#f8f9fc;--pborder:#dde0ea;
  --input:#f0f2f7;--btn:#e8ebf2;--btn2:#dde0ea;
  --cborder:#c0c5d5;--done:#b0b5c5;
  --overlay:rgba(0,0,0,.38);
  --modal:#fff;--mborder:#dde0ea;
}}
:root[data-theme="dark"]{
  --bg:#0d0f14;--surface:#171a22;--surface2:#1e2130;
  --border:#252833;--border2:#1c1f2a;
  --t1:#e8eaf0;--t2:#7c8296;--t3:#454b60;--t4:#2a2e40;
  --today-bg:#1e2540;--sel-bg:#1a2242;
  --panel:#131620;--pborder:#252a3a;
  --input:#1a1d2a;--btn:#252a3a;--btn2:#2e3347;
  --cborder:#3d4255;--done:#454b60;
  --overlay:rgba(0,0,0,.72);
  --modal:#171a22;--mborder:#252833;
}
:root[data-theme="light"]{
  --bg:#f0f2f7;--surface:#fff;--surface2:#f8f9fc;
  --border:#dde0ea;--border2:#e8ebf2;
  --t1:#1a1d27;--t2:#6b7080;--t3:#b0b5c5;--t4:#d0d4e0;
  --today-bg:#e8edff;--sel-bg:#dce7ff;
  --panel:#f8f9fc;--pborder:#dde0ea;
  --input:#f0f2f7;--btn:#e8ebf2;--btn2:#dde0ea;
  --cborder:#c0c5d5;--done:#b0b5c5;
  --overlay:rgba(0,0,0,.38);
  --modal:#fff;--mborder:#dde0ea;
}

body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}

/* ── Layout ── */
.layout{display:flex;min-height:100vh}
.cal-col{flex:1;min-width:0;padding:20px;display:flex;flex-direction:column;gap:16px}
.day-col{width:300px;flex-shrink:0;border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;transition:width .22s}
.day-col.hidden{width:0;border-left:none;overflow:hidden;pointer-events:none}

/* ── Cal header ── */
.cal-header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.month-nm{font-size:22px;font-weight:600;letter-spacing:-.4px}
.year-nm{font-size:22px;font-weight:300;color:var(--t2)}
.legend{display:flex;gap:12px;margin-left:auto;align-items:center;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)}
.leg-dot{width:7px;height:7px;border-radius:50%}

/* ── Grid ── */
.cal-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:var(--surface2)}
.wday{padding:9px 0;text-align:center;font-size:11px;font-weight:600;color:var(--t2);letter-spacing:.08em;text-transform:uppercase}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr)}

.cal-day{min-height:88px;padding:7px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background .1s}
.cal-day:nth-child(7n){border-right:none}
.cal-day.empty{cursor:default;opacity:.18;pointer-events:none}
.cal-day.today{background:var(--today-bg)}
.cal-day.sel{background:var(--sel-bg)}
.cal-day:hover:not(.empty){background:var(--surface2)}
.day-num{font-size:12px;font-weight:500;color:var(--t2);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;font-variant-numeric:tabular-nums}
.cal-day.today .day-num{background:var(--blue);color:#fff}
.cal-day.weekend .day-num{color:var(--t3)}

/* ── Chips ── */
.chip-list{display:flex;flex-direction:column;gap:3px;flex:1}
.chip{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:5px;font-size:10.5px;font-weight:500;line-height:1.3}
.chip.cdone{opacity:.35}
.chip-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.c-grupo{background:rgba(74,127,212,.15);color:#4a7fd4}
.c-post{background:rgba(212,150,58,.15);color:#d4963a}
.c-tese{background:rgba(58,173,114,.15);color:#3aad72}
.c-producao{background:rgba(155,114,207,.15);color:#9b72cf}
.c-planejar{background:rgba(58,184,176,.15);color:#3ab8b0}
.c-semestre{background:rgba(207,114,114,.15);color:#cf7272}

/* ── Day panel ── */
.day-inner{display:flex;flex-direction:column;height:100%;overflow:hidden}
.day-hdr{padding:16px 14px 12px;border-bottom:1px solid var(--pborder);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.day-date{font-size:15px;font-weight:600}
.day-wday{font-size:11px;color:var(--t2);margin-top:2px}
.icon-btn{width:26px;height:26px;border-radius:50%;background:var(--btn);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0;transition:background .1s,color .1s}
.icon-btn:hover{background:var(--btn2);color:var(--t1)}
.day-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.day-body::-webkit-scrollbar{width:4px}
.day-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}

/* ── Task rows in panel ── */
.task-list{display:flex;flex-direction:column;gap:3px}
.task-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;background:var(--input);border:1px solid var(--border2);cursor:pointer;user-select:none;transition:background .1s,border-color .1s}
.task-row:hover{background:var(--btn);border-color:var(--border)}
.task-row:active{background:var(--btn2)}
.t-cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--cborder);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,border-color .12s}
.t-cb.done{background:var(--blue);border-color:var(--blue)}
.t-cb .cbico{display:none}
.t-cb.done .cbico{display:block}
.t-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.t-lbl{flex:1;font-size:13px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-lbl.done{color:var(--done);text-decoration:line-through}
.t-arr{color:var(--t3);flex-shrink:0;display:flex}
.add-t-btn{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;border:1.5px dashed var(--border);background:none;cursor:pointer;font-size:12px;color:var(--t2);width:100%;font-family:inherit;transition:border-color .1s,color .1s,background .1s}
.add-t-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(74,127,212,.07)}

/* ── Day notes ── */
.day-notes{width:100%;min-height:64px;background:var(--input);border:1px solid var(--border2);border-radius:9px;padding:9px;resize:vertical;font-size:13px;color:var(--t1);font-family:inherit;outline:none;line-height:1.5;transition:border-color .12s}
.day-notes::placeholder{color:var(--t4)}
.day-notes:focus{border-color:var(--blue)}

/* ── Task modal overlay ── */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:stretch;justify-content:flex-end;z-index:200;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.overlay.hidden{display:none}
.task-modal{width:420px;max-width:100vw;background:var(--modal);border-left:1px solid var(--mborder);display:flex;flex-direction:column;overflow:hidden}

.m-hdr{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.m-type-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.m-title{flex:1;font-size:15px;font-weight:600;color:var(--t1);background:transparent;border:none;outline:none;font-family:inherit}
.m-title.done{color:var(--done);text-decoration:line-through}

.m-meta{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.done-tog{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.done-cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--cborder);display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.done-cb.done{background:var(--blue);border-color:var(--blue)}
.done-cb .dchk{display:none}
.done-cb.done .dchk{display:block}
.done-txt{font-size:12px;color:var(--t2)}
.type-sel{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.type-btn{padding:3px 8px;border-radius:20px;border:none;cursor:pointer;font-size:10.5px;font-weight:600;font-family:inherit;opacity:.45;transition:opacity .12s}
.type-btn.active{opacity:1}
.type-btn:hover{opacity:.8}

.m-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px}
.m-body::-webkit-scrollbar{width:4px}
.m-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.m-del-wrap{padding-top:8px;border-top:1px solid var(--border2)}
.m-del-btn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--t3);font-family:inherit;padding:4px 0;transition:color .1s}
.m-del-btn:hover{color:#cf7272}

/* ── Subtasks ── */
.sub-list{display:flex;flex-direction:column;gap:3px}
.sub-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.s-cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--cborder);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.s-cb.done{background:var(--t2);border-color:var(--t2)}
.s-cb .sico{display:none}
.s-cb.done .sico{display:block}
.s-lbl{flex:1;font-size:13px;color:var(--t1);background:none;border:none;outline:none;font-family:inherit;cursor:text}
.s-lbl::placeholder{color:var(--t4)}
.s-lbl.done{color:var(--t3);text-decoration:line-through}
.s-del{width:18px;height:18px;border-radius:4px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t3);flex-shrink:0;transition:color .1s}
.s-del:hover{color:var(--t2)}
.add-sub{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;padding:4px 0;text-align:left;font-family:inherit;display:flex;align-items:center;gap:4px;opacity:.8;transition:opacity .1s}
.add-sub:hover{opacity:1}

/* ── Notes ── */
.m-notes{width:100%;min-height:80px;background:var(--input);border:1px solid var(--border2);border-radius:9px;padding:10px;resize:vertical;font-size:13px;color:var(--t1);font-family:inherit;outline:none;line-height:1.5;transition:border-color .12s}
.m-notes::placeholder{color:var(--t4)}
.m-notes:focus{border-color:var(--blue)}

/* ── Links ── */
.links-list{display:flex;flex-direction:column;gap:4px}
.lk-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--input);border:1px solid var(--border2);border-radius:8px}
.lk-ico{color:var(--blue);flex-shrink:0;display:flex}
.lk-txt{flex:1;min-width:0}
.lk-name{font-size:12px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-url{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-open{color:var(--blue);text-decoration:none;flex-shrink:0;opacity:.6;display:flex;transition:opacity .1s}
.lk-open:hover{opacity:1}
.lk-del{width:18px;height:18px;border-radius:4px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t3);flex-shrink:0;transition:color .1s}
.lk-del:hover{color:var(--t2)}
.lk-form{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--input);border:1px solid var(--border2);border-radius:9px}
.lk-form.hidden{display:none}
.txt-inp{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12px;color:var(--t1);font-family:inherit;outline:none;width:100%;transition:border-color .12s}
.txt-inp::placeholder{color:var(--t4)}
.txt-inp:focus{border-color:var(--blue)}
.form-row{display:flex;gap:5px;justify-content:flex-end}
.btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:inherit}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{filter:brightness(1.1)}
.btn-s{background:var(--btn);color:var(--t2)}
.btn-s:hover{background:var(--btn2);color:var(--t1)}
.add-lk{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;border:1.5px dashed var(--border);background:none;cursor:pointer;font-size:12px;color:var(--t2);width:100%;font-family:inherit;transition:border-color .1s,color .1s,background .1s}
.add-lk:hover{border-color:var(--blue);color:var(--blue);background:rgba(74,127,212,.07)}

/* ── Images ── */
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.img-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;background:var(--input);border:1px solid var(--border2)}
.img-thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.img-del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.7);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .12s}
.img-thumb:hover .img-del{opacity:1}
.drop-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 10px;border:1.5px dashed var(--border);border-radius:9px;cursor:pointer;text-align:center;position:relative;transition:border-color .12s,background .12s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--teal);background:rgba(58,184,176,.07)}
.drop-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-ico{color:var(--t3);display:flex}
.dz-txt{font-size:12px;color:var(--t2)}
.dz-hint{font-size:10.5px;color:var(--t3)}

/* ── Lightbox ── */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:400;cursor:zoom-out}
.lightbox.hidden{display:none}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}

/* ── Responsive ── */
@media(max-width:860px){
  .layout{flex-direction:column}
  .day-col{width:100%;border-left:none;border-top:1px solid var(--border);max-height:50vh}
  .day-col.hidden{max-height:0}
  .task-modal{width:100vw;border-left:none}
  .legend{display:none}
}
</style>

<div class="layout">

  <!-- Calendar column -->
  <div class="cal-col">
    <div class="cal-header">
      <span class="month-nm">Agosto</span>
      <span class="year-nm">2026</span>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:#4a7fd4"></div>Mensagem no grupo</div>
        <div class="leg-item"><div class="leg-dot" style="background:#d4963a"></div>Publicar post</div>
        <div class="leg-item"><div class="leg-dot" style="background:#3aad72"></div>Escrever tese</div>
        <div class="leg-item"><div class="leg-dot" style="background:#9b72cf"></div>Criar posts</div>
        <div class="leg-item"><div class="leg-dot" style="background:#3ab8b0"></div>Planejar conteúdos</div>
        <div class="leg-item"><div class="leg-dot" style="background:#cf7272"></div>Próximo semestre</div>
      </div>
    </div>
    <div class="cal-wrap">
      <div class="weekdays">
        <div class="wday">Dom</div><div class="wday">Seg</div><div class="wday">Ter</div>
        <div class="wday">Qua</div><div class="wday">Qui</div><div class="wday">Sex</div><div class="wday">Sáb</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>
  </div>

  <!-- Day detail panel -->
  <div class="day-col hidden" id="dayCol">
    <div class="day-inner">
      <div class="day-hdr">
        <div>
          <div class="day-date" id="dayDate"></div>
          <div class="day-wday" id="dayWday"></div>
        </div>
        <button class="icon-btn" id="dayClose" title="Fechar">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="day-body" id="dayBody"></div>
    </div>
  </div>

</div>

<!-- Task modal (full detail) -->
<div class="overlay hidden" id="overlay">
  <div class="task-modal" id="taskModal">

    <div class="m-hdr">
      <div class="m-type-dot" id="mDot"></div>
      <input class="m-title" id="mTitle" type="text" spellcheck="false" placeholder="Título da tarefa">
      <button class="icon-btn" id="mClose" title="Fechar">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="m-meta">
      <div class="done-tog" id="mDoneTog">
        <div class="done-cb" id="mDoneCb">
          <svg class="dchk" width="11" height="11" viewBox="0 0 11 11" fill="none">
            <path d="M2 5.5l2.5 2.5 4.5-5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="done-txt" id="mDoneTxt">Marcar como concluída</span>
      </div>
      <div class="type-sel" id="mTypeSel"></div>
    </div>

    <div class="m-body" id="mBody"></div>

  </div>
</div>

<!-- Lightbox -->
<div class="lightbox hidden" id="lightbox">
  <img id="lbImg" src="" alt="">
</div>

<script>
(function(){
'use strict';

var KEY = 'cc-agosto-2026-v4';
var WDAYS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

var TYPES = {

  semestre: {color:'#cf7272', label:'Semestre'}
};

var PRESETS = {

  '2026-08-08':[{type:'producao',label:'Criar posts'}],

  '2026-08-13':[{type:'post',label:'Publicar post'},{type:'planejar',label:'Planejar conteúdos'}],
  '2026-08-15':[{type:'producao',label:'Criar posts'}],
  '2026-08-17':[{type:'grupo',label:'Mensagem no grupo'},{type:'post',label:'Publicar post'}],
  '2026-08-20':[{type:'post',label:'Publicar post'},{type:'tese',label:'Escrever tese'}],
  '2026-08-22':[{type:'producao',label:'Criar posts'}],
  '2026-08-24':[{type:'grupo',label:'Mensagem no grupo'},{type:'post',label:'Publicar post'}],
  '2026-08-27':[{type:'post',label:'Publicar post'},{type:'planejar',label:'Planejar conteúdos'}],
  '2026-08-29':[{type:'producao',label:'Criar posts'}],
  '2026-08-31':[{type:'grupo',label:'Mensagem no grupo'},{type:'post',label:'Publicar post'},{type:'semestre',label:'Criar próximo semestre'}]
};

var activeDate = null;
var activeTaskId = null;

/* ── Storage ── */
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}

function getDayData(d,key){
  if(!d[key]){
    var pre=PRESETS[key]||[];
    d[key]={
      notes:'',
      tasks:pre.map(function(p,i){return{id:'p'+i,type:p.type,label:p.label,done:false,subtasks:[],notes:'',links:[],images:[]}})
    };
  }
  var tasks=d[key].tasks||[];
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i];
    if(!t.subtasks)t.subtasks=[];
    if(!t.notes)t.notes='';
    if(!t.links)t.links=[];
    if(!t.images)t.images=[];
  }
  return d[key];
}

function findTask(d,dateKey,taskId){
  var dd=getDayData(d,dateKey);
  var tasks=dd.tasks||[];
  for(var i=0;i<tasks.length;i++){if(tasks[i].id===taskId)return tasks[i];}
  return null;
}

function findById(arr,id){
  if(!arr)return null;
  for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}
  return null;
}

function uid(){return 'u'+Date.now()+Math.floor(Math.random()*9999)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hexRgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')'}

/* ── Calendar ── */
function renderCal(){
  var data=load();
  var grid=document.getElementById('daysGrid');
  grid.innerHTML='';
  // Aug 1 2026 = Saturday = col 6 → OFFSET=6
  var OFFSET=6;
  for(var i=0;i<42;i++){
    var dayN=i-OFFSET+1;
    var real=(dayN>=1&&dayN<=31);
    var col=i%7;
    var wknd=(col===0||col===6);
    var dk=real?('2026-08-'+(dayN<10?'0':'')+dayN):null;
    var isToday=(dk==='2026-08-03');
    var isSel=(dk&&dk===activeDate);

    var cell=document.createElement('div');
    var cls='cal-day';
    if(!real)cls+=' empty';
    else if(wknd)cls+=' weekend';
    if(isToday)cls+=' today';
    if(isSel)cls+=' sel';
    cell.className=cls;

    if(dk){
      (function(dateKey){
        cell.addEventListener('click',function(){openDay(dateKey);});
      })(dk);
    }

    var numEl=document.createElement('div');
    numEl.className='day-num';
    numEl.textContent=real?String(dayN):'';
    cell.appendChild(numEl);

    if(dk){
      var dd=data[dk];
      var tasks=dd?dd.tasks:(PRESETS[dk]||[]).map(function(p,j){return{id:'p'+j,type:p.type,label:p.label,done:false};});
      if(tasks&&tasks.length){
        var cl=document.createElement('div');
        cl.className='chip-list';
        var show=Math.min(tasks.length,3);
        for(var j=0;j<show;j++){
          var tk=tasks[j];
          var chip=document.createElement('div');
          chip.className='chip c-'+tk.type+(tk.done?' cdone':'');
          var cdot=document.createElement('div');
          cdot.className='chip-dot';
          cdot.style.background=(TYPES[tk.type]||{}).color||'#888';
          var clbl=document.createElement('span');
          clbl.textContent=tk.label;
          chip.appendChild(cdot);chip.appendChild(clbl);
          cl.appendChild(chip);
        }
        if(tasks.length>3){
          var more=document.createElement('div');
          more.style.cssText='font-size:10px;color:var(--t3);padding:1px 4px';
          more.textContent='+'+(tasks.length-3);
          cl.appendChild(more);
        }
        cell.appendChild(cl);
      }
    }
    grid.appendChild(cell);
  }
}

/* ── Day panel ── */
function openDay(dateKey){
  var d=load();getDayData(d,dateKey);save(d);
  activeDate=dateKey;
  document.getElementById('dayCol').classList.remove('hidden');
  var parts=dateKey.split('-');
  var dayN=parseInt(parts[2],10);
  var dt=new Date(parseInt(parts[0],10),parseInt(parts[1],10)-1,dayN);
  document.getElementById('dayDate').textContent=dayN+' de agosto de 2026';
  document.getElementById('dayWday').textContent=WDAYS[dt.getDay()];
  renderDay(dateKey);
  renderCal();
}

function closeDay(){
  activeDate=null;
  document.getElementById('dayCol').classList.add('hidden');
  renderCal();
}

document.getElementById('dayClose').addEventListener('click',closeDay);

function renderDay(dateKey){
  var d=load();
  var dd=getDayData(d,dateKey);
  var body=document.getElementById('dayBody');
  body.innerHTML='';

  /* Tasks */
  var sec1=document.createElement('div');
  var lbl1=document.createElement('div');lbl1.className='sec-lbl';lbl1.textContent='Tarefas';
  sec1.appendChild(lbl1);

  var tList=document.createElement('div');tList.className='task-list';
  var tasks=dd.tasks||[];
  for(var i=0;i<tasks.length;i++){tList.appendChild(mkTaskRow(tasks[i],dateKey));}
  sec1.appendChild(tList);

  var addBtn=document.createElement('button');
  addBtn.className='add-t-btn';
  addBtn.innerHTML='<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Nova tarefa';
  addBtn.addEventListener('click',function(){
    var d2=load();
    var newT={id:uid(),type:'post',label:'Nova tarefa',done:false,subtasks:[],notes:'',links:[],images:[]};
    getDayData(d2,dateKey).tasks.push(newT);
    save(d2);
    renderDay(dateKey);
    renderCal();
    openModal(dateKey,newT.id);
  });
  sec1.appendChild(addBtn);
  body.appendChild(sec1);

  /* Day notes */
  var sec2=document.createElement('div');
  var lbl2=document.createElement('div');lbl2.className='sec-lbl';lbl2.textContent='Notas do dia';
  sec2.appendChild(lbl2);
  var ta=document.createElement('textarea');
  ta.className='day-notes';ta.placeholder='Anotações sobre o dia...';ta.value=dd.notes||'';
  ta.addEventListener('input',function(){
    var d2=load();getDayData(d2,dateKey).notes=ta.value;save(d2);
  });
  sec2.appendChild(ta);
  body.appendChild(sec2);
}

function mkTaskRow(task,dateKey){
  var row=document.createElement('div');
  row.className='task-row';

  var cb=document.createElement('div');
  cb.className='t-cb'+(task.done?' done':'');
  cb.innerHTML='<svg class="cbico" width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5l2 2 4-4" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var dot=document.createElement('div');
  dot.className='t-dot';
  dot.style.background=(TYPES[task.type]||{}).color||'#888';

  var lbl=document.createElement('div');
  lbl.className='t-lbl'+(task.done?' done':'');
  lbl.textContent=task.label||'Sem título';

  var arr=document.createElement('div');
  arr.className='t-arr';
  arr.innerHTML='<svg width="6" height="10" viewBox="0 0 6 10" fill="none"><path d="M1 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  row.appendChild(cb);row.appendChild(dot);row.appendChild(lbl);row.appendChild(arr);

  /* Checkbox toggles done, does NOT open modal */
  cb.addEventListener('click',function(e){
    e.stopPropagation();
    toggleDone(dateKey,task.id);
  });

  /* Row click → open modal */
  row.addEventListener('click',function(e){
    if(cb===e.target||cb.contains(e.target))return;
    openModal(dateKey,task.id);
  });

  return row;
}

function toggleDone(dateKey,taskId){
  var d=load();
  var t=findTask(d,dateKey,taskId);
  if(t)t.done=!t.done;
  save(d);
  renderCal();
  if(activeDate===dateKey)renderDay(dateKey);
  // Sync modal if open for this task
  if(activeTaskId===taskId){
    var isDone=t&&t.done;
    document.getElementById('mDoneCb').classList.toggle('done',!!isDone);
    document.getElementById('mTitle').classList.toggle('done',!!isDone);
    document.getElementById('mDoneTxt').textContent=isDone?'Concluída':'Marcar como concluída';
  }
}

/* ── Modal ── */
var overlay=document.getElementById('overlay');

document.getElementById('mClose').addEventListener('click',closeModal);
overlay.addEventListener('click',function(e){if(e.target===overlay)closeModal();});
document.getElementById('taskModal').addEventListener('click',function(e){e.stopPropagation();});

function openModal(dateKey,taskId){
  activeTaskId=taskId;
  overlay.classList.remove('hidden');
  buildModal(dateKey,taskId);
  // Focus title
  setTimeout(function(){
    var ti=document.getElementById('mTitle');
    if(ti){ti.focus();ti.select();}
  },50);
}

function closeModal(){
  activeTaskId=null;
  overlay.classList.add('hidden');
}

function buildModal(dateKey,taskId){
  var d=load();
  var task=findTask(d,dateKey,taskId);
  if(!task)return;

  /* Type dot */
  var dot=document.getElementById('mDot');
  dot.style.background=(TYPES[task.type]||{}).color||'#888';

  /* Title */
  var titleEl=document.getElementById('mTitle');
  titleEl.value=task.label||'';
  titleEl.className='m-title'+(task.done?' done':'');
  titleEl.onblur=function(){
    var v=titleEl.value.trim()||task.label;
    var d2=load();var t=findTask(d2,dateKey,taskId);
    if(t){t.label=v;save(d2);task.label=v;}
    renderDay(dateKey);renderCal();
  };
  titleEl.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();titleEl.blur();}};

  /* Done toggle */
  var doneCb=document.getElementById('mDoneCb');
  doneCb.className='done-cb'+(task.done?' done':'');
  var doneTxt=document.getElementById('mDoneTxt');
  doneTxt.textContent=task.done?'Concluída':'Marcar como concluída';
  document.getElementById('mDoneTog').onclick=function(){toggleDone(dateKey,taskId);};

  /* Type selector */
  var typeSel=document.getElementById('mTypeSel');
  typeSel.innerHTML='';
  var typeKeys=['grupo','post','tese','producao','planejar','semestre'];
  for(var ti=0;ti<typeKeys.length;ti++){
    (function(tKey){
      var info=TYPES[tKey];
      var btn=document.createElement('button');
      btn.className='type-btn'+(task.type===tKey?' active':'');
      btn.textContent=info.label;
      btn.style.background=hexRgba(info.color,.18);
      btn.style.color=info.color;
      btn.addEventListener('click',function(){
        var d2=load();var t=findTask(d2,dateKey,taskId);
        if(t){t.type=tKey;save(d2);task.type=tKey;}
        dot.style.background=info.color;
        var btns=typeSel.querySelectorAll('.type-btn');
        for(var bi=0;bi<btns.length;bi++)btns[bi].classList.remove('active');
        btn.classList.add('active');
        renderDay(dateKey);renderCal();
      });
      typeSel.appendChild(btn);
    })(typeKeys[ti]);
  }

  /* Body */
  var body=document.getElementById('mBody');
  body.innerHTML='';

  buildSubSec(body,task,dateKey,taskId);
  buildNotesSec(body,task,dateKey,taskId);
  buildImgSec(body,task,dateKey,taskId);
  buildLinksSec(body,task,dateKey,taskId);

  /* Delete task */
  var delWrap=document.createElement('div');
  delWrap.className='m-del-wrap';
  var delBtn=document.createElement('button');
  delBtn.className='m-del-btn';
  delBtn.textContent='Remover tarefa';
  delBtn.addEventListener('click',function(){
    if(!confirm('Remover esta tarefa?'))return;
    var d2=load();var dd=getDayData(d2,dateKey);
    dd.tasks=dd.tasks.filter(function(x){return x.id!==taskId;});
    save(d2);
    closeModal();
    renderDay(dateKey);
    renderCal();
  });
  delWrap.appendChild(delBtn);
  body.appendChild(delWrap);
}

/* ── Subtasks section ── */
function buildSubSec(body,task,dateKey,taskId){
  var sec=document.createElement('div');
  var lbl=document.createElement('div');lbl.className='sec-lbl';lbl.textContent='Subtarefas';
  sec.appendChild(lbl);

  var list=document.createElement('div');list.className='sub-list';
  var subs=task.subtasks||[];
  for(var i=0;i<subs.length;i++){list.appendChild(mkSubRow(subs[i],task,dateKey,taskId,list));}
  sec.appendChild(list);

  var addBtn=document.createElement('button');
  addBtn.className='add-sub';
  addBtn.innerHTML='<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> Adicionar subtarefa';
  addBtn.addEventListener('click',function(){
    var ns={id:uid(),label:'',done:false};
    var d2=load();var t=findTask(d2,dateKey,taskId);
    if(t){if(!t.subtasks)t.subtasks=[];t.subtasks.push(ns);save(d2);}
    task.subtasks=task.subtasks||[];task.subtasks.push(ns);
    var row=mkSubRow(ns,task,dateKey,taskId,list);
    list.appendChild(row);
    var inp=row.querySelector('.s-lbl');if(inp)inp.focus();
  });

  body.appendChild(sec);
}

function mkSubRow(sub,task,dateKey,taskId,listEl){
  var row=document.createElement('div');row.className='sub-row';

  var cb=document.createElement('div');
  cb.className='s-cb'+(sub.done?' done':'');
  cb.innerHTML='<svg class="sico" width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1.5 4l1.5 1.5 3.5-3.5" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var inp=document.createElement('input');
  inp.type='text';inp.className='s-lbl'+(sub.done?' done':'');
  inp.value=sub.label;inp.placeholder='Subtarefa...';inp.spellcheck=false;

  var del=document.createElement('button');
  del.className='s-del';
  del.innerHTML='<svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 1l6 6M7 1L1 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';

  cb.addEventListener('click',function(){
    sub.done=!sub.done;
    cb.classList.toggle('done',sub.done);
    inp.classList.toggle('done',sub.done);
    var d2=load();var t=findTask(d2,dateKey,taskId);
    if(t&&t.subtasks){var sx=findById(t.subtasks,sub.id);if(sx)sx.done=sub.done;}
    save(d2);
  });

  inp.addEventListener('blur',function(){
    sub.label=inp.value.trim();
    var d2=load();var t=findTask(d2,dateKey,taskId);
    if(t&&t.subtasks){var sx=findById(t.subtasks,sub.id);if(sx)sx.label=sub.label;}
    save(d2);
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();inp.blur();}});

  del.addEventListener('click',function(){
    var d2=load();var t=findTask(d2,dateKey,taskId);
    if(t&&t.subtasks){t.subtasks=t.subtasks.filter(function(x){return x.id!==sub.id;});}
    save(d2);
    task.subtasks=(task.subtasks||[]).filter(function(x){return x.id!==sub.id;});
    row.remove();
  });

  row.appendChild(cb);row.appendChild(inp);row.appendChild(del);
  return row;
}

  sec.appendChild(lbl);

/* ── Images section ── */
function buildImgSec(body,task,dateKey,taskId){
  var sec=document.createElement('div');
  var lbl=document.createElement('div');lbl.className='sec-lbl';lbl.textContent='Imagens';
  sec.appendChild(lbl);

  var grid=document.createElement('div');grid.className='img-grid';
  var imgs=task.images||[];
  for(var i=0;i<imgs.length;i++){grid.appendChild(mkImgThumb(imgs[i],task,dateKey,taskId,grid));}
  sec.appendChild(grid);

  var dz=document.createElement('div');dz.className='drop-zone';
  dz.innerHTML='<div class="dz-ico"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="1.5" width="17" height="17" rx="3.5" stroke="currentColor" stroke-width="1.3"/><circle cx="6.5" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 14l5-5 3.5 3.5 3-3 5.5 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="dz-txt">Clique ou arraste imagens aqui</div><div class="dz-hint">Ctrl+V para colar da área de transferência</div>';

  var fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.multiple=true;
  fi.addEventListener('change',function(e){processFiles(e.target.files,task,dateKey,taskId,grid);fi.value='';});
  dz.appendChild(fi);

  dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag-over');});
  dz.addEventListener('dragleave',function(){dz.classList.remove('drag-over');});
  dz.addEventListener('drop',function(e){
    e.preventDefault();dz.classList.remove('drag-over');
    processFiles(e.dataTransfer.files,task,dateKey,taskId,grid);
  });
  sec.appendChild(dz);
  body.appendChild(sec);
}

function mkImgThumb(im,task,dateKey,taskId,gridEl){
  var wrap=document.createElement('div');wrap.className='img-thumb';
  var img=document.createElement('img');img.src=im.src;img.alt=im.name||'';
  img.addEventListener('click',function(){openLightbox(im.src);});
  var del=document.createElement('button');del.className='img-del';
  del.innerHTML='<svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 1l6 6M7 1L1 7" stroke="white" stroke-width="1.3" stroke-linecap="round"/></svg>';
  del.addEventListener('click',function(){
    var d2=load();var t=findTask(d2,dateKey,taskId);
    if(t&&t.images){t.images=t.images.filter(function(x){return x.id!==im.id;});save(d2);}
    task.images=(task.images||[]).filter(function(x){return x.id!==im.id;});
    wrap.remove();
  });
  wrap.appendChild(img);wrap.appendChild(del);
  return wrap;
}

function processFiles(files,task,dateKey,taskId,gridEl){
  var arr=Array.prototype.slice.call(files||[]);
  for(var i=0;i<arr.length;i++){
    (function(file){
      if(!file||!file.type.match(/^image\//))return;
      var reader=new FileReader();
      reader.onload=function(ev){
        var rawImg=new Image();
        rawImg.onload=function(){
          var MAX=800,w=rawImg.width,h=rawImg.height;
          if(w>MAX||h>MAX){
            if(w>=h){h=Math.round(h*MAX/w);w=MAX;}
            else{w=Math.round(w*MAX/h);h=MAX;}
          }
          var cv=document.createElement('canvas');cv.width=w;cv.height=h;
          cv.getContext('2d').drawImage(rawImg,0,0,w,h);
          var src=cv.toDataURL('image/jpeg',0.82);
          var nm={id:uid(),src:src,name:file.name||'image'};
          var d2=load();var t=findTask(d2,dateKey,taskId);
          if(t){if(!t.images)t.images=[];t.images.push(nm);save(d2);}
          task.images=task.images||[];task.images.push(nm);
          gridEl.appendChild(mkImgThumb(nm,task,dateKey,taskId,gridEl));
        };
        rawImg.src=ev.target.result;
      };
      reader.readAsDataURL(file);
    })(arr[i]);
  }
}

/* ── Links section ── */
function buildLinksSec(body,task,dateKey,taskId){

  var form=document.createElement('div');form.className='lk-form hidden';
  var urlInp=document.createElement('input');urlInp.className='txt-inp';urlInp.type='url';urlInp.placeholder='https://...';
  var lblInp=document.createElement('input');lblInp.className='txt-inp';lblInp.placeholder='Nome do link (opcional)';
  var frow=document.createElement('div');frow.className='form-row';
  var cancelB=document.createElement('button');cancelB.className='btn btn-s';cancelB.type='button';cancelB.textContent='Cancelar';
  var saveB=document.createElement('button');saveB.className='btn btn-p';saveB.type='button';saveB.textContent='Salvar';
  frow.appendChild(cancelB);frow.appendChild(saveB);
  form.appendChild(urlInp);form.appendChild(lblInp);form.appendChild(frow);

  var addBtn=document.createElement('button');addBtn.className='add-lk';
  addBtn.innerHTML='<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Adicionar link';

  cancelB.addEventListener('click',function(){form.classList.add('hidden');addBtn.style.display='';});
  saveB.addEventListener('click',function(){
    var url=urlInp.value.trim();if(!url)return;
    var nl={id:uid(),url:url,label:lblInp.value.trim()||url};
    var d2=load();var t=findTask(d2,dateKey,taskId);
    if(t){if(!t.links)t.links=[];t.links.push(nl);save(d2);}

    list.appendChild(mkLinkItem(nl,task,dateKey,taskId,list));
    urlInp.value='';lblInp.value='';
    form.classList.add('hidden');addBtn.style.display='';
  });
  addBtn.addEventListener('click',function(){form.classList.remove('hidden');addBtn.style.display='none';urlInp.focus();});

  sec.appendChild(form);sec.appendChild(addBtn);
  body.appendChild(sec);
}

function mkLinkItem(lk,task,dateKey,taskId,listEl){
  var item=document.createElement('div');item.className='lk-item';
  var ico=document.createElement('div');ico.className='lk-ico';
  ico.innerHTML='<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M5 8.5L8.5 5M7.5 2.5l1.5-1.5a2.12 2.12 0 013 3L10.5 5.5M5.5 7.5l-1.5 1.5a2.12 2.12 0 01-3-3L2.5 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';
  var txt=document.createElement('div');txt.className='lk-txt';
  var nm=document.createElement('div');nm.className='lk-name';nm.textContent=lk.label||lk.url;
  var url=document.createElement('div');url.className='lk-url';url.textContent=lk.url;
  txt.appendChild(nm);txt.appendChild(url);
  var open=document.createElement('a');open.className='lk-open';open.href=lk.url;open.target='_blank';open.rel='noopener';
  open.innerHTML='<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 9L9 2M9 2H5.5M9 2v3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var del=document.createElement('button');del.className='lk-del';
  del.innerHTML='<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 1l7 7M8 1L1 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
  del.addEventListener('click',function(){
    var d2=load();var t=findTask(d2,dateKey,taskId);
    if(t&&t.links){t.links=t.links.filter(function(x){return x.id!==lk.id;});save(d2);}
    task.links=(task.links||[]).filter(function(x){return x.id!==lk.id;});
    item.remove();
  });
  item.appendChild(ico);item.appendChild(txt);item.appendChild(open);item.appendChild(del);
  return item;
}

/* ── Lightbox ── */
var lb=document.getElementById('lightbox');
var lbImg=document.getElementById('lbImg');
function openLightbox(src){lbImg.src=src;lb.classList.remove('hidden');}
lb.addEventListener('click',function(){lb.classList.add('hidden');lbImg.src='';});

/* ── Paste ── */
document.addEventListener('paste',function(e){
  if(!activeTaskId||!activeDate)return;
  if(overlay.classList.contains('hidden'))return;
  var items=(e.clipboardData||{}).items;
  if(!items)return;
  var d=load();var task=findTask(d,activeDate,activeTaskId);if(!task)return;
  var grid=document.querySelector('#mBody .img-grid');if(!grid)return;
  for(var i=0;i<items.length;i++){
    if(items[i].type.match(/^image\//)){
      var file=items[i].getAsFile();
      if(file)processFiles([file],task,activeDate,activeTaskId,grid);
    }
  }
});

/* ── Init ── */
renderCal();

})();
</script>
</body>
</html>
